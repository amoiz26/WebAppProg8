
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fetch Demo</title>
</head>
<body>
    <h1>Fetch Demo - Server Computation</h1>

    <label for="x">Enter X:</label>
    <input type="number" id="x" value="10">

    <label for="y">Enter Y:</label>
    <input type="number" id="y" value="11">

    <button onclick="computeOnServer()">
        Compute on Server
    </button>

    <div id="result"></div>

    <script>
        function computeOnServer() {
            const x = document.getElementById('x').value;
            const y = document.getElementById('y').value;

            const url = `/compute?x=${encodeURIComponent(x)}&y=${encodeURIComponent(y)}`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.text();
                })
                .then(data => {
                    document.getElementById('result').textContent = data;
                })
                .catch(error => {
                    document.getElementById('result').textContent =
                        `Request failed: ${error.message}`;
                });
        }
    </script>
</body>
</html>
